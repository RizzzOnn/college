<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <label for="Username">Username: <input type="text"></label>
        <label for="Password">Password: <input type="password"></label>
        <br>
        <input type="radio" name="gender" id="Male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="Female">
        <label for="female">Female</label>  
        <label for="file-select">Upload File: <input type="file" id="file-select"></label>
        <label for="address">Address:</label>
        <textarea rows="3" cols=""></textarea>
        <fieldset>
            <legend>Contact Details</legend>
            <label for="email"></label>Email: <input type="email"></label>
            <label for="phone"></label>Phone: <input type="tel"></label>
        </fieldset>

        <br>      
        <input type="submit" value="Submit">
    </form>
</body>
</html>
